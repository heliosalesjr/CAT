<!-- @dsCard group="Actions" height=210 subtitle="Square, uppercase, no radius" -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Google+Sans:GRAD,wght@-50..150,400..700&display=swap">
<style>
  body { margin:0; padding:24px; background:var(--surface); font-family:Archivo,system-ui,sans-serif; }
  .row { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:20px; }
  .btn { display:inline-flex; align-items:center; gap:10px; font-family:Archivo,system-ui,sans-serif;
    font-variation-settings:"wdth" 90; font-weight:600; font-size:12.5px; letter-spacing:.12em;
    text-transform:uppercase; line-height:1; padding:16px 24px; border:0; border-radius:0;
    white-space:nowrap; cursor:pointer; transition:background-color 160ms ease,color 160ms ease,border-color 160ms ease,transform 140ms cubic-bezier(.23,1,.32,1); }
  .btn:active { transform:scale(.97); }
  .btn:focus-visible { outline:2px solid var(--green-deep); outline-offset:3px; }
  .btn-green { background:var(--green-ink); color:var(--surface); }
  .btn-green:hover { background:var(--green-pressed); }
  .btn-gold { background:var(--gold); color:var(--ink); }
  .btn-gold:hover { background:var(--gold-deep); }
  .btn-navy { background:var(--ink); color:var(--surface); }
  .btn-outline { background:transparent; border:1px solid var(--border-control); color:var(--ink); }
  .btn-outline:hover { background:var(--ink); color:var(--surface); border-color:var(--ink); }
  .cap { font-size:10.5px; font-variation-settings:"wdth" 70; font-weight:500; letter-spacing:.15em;
    text-transform:uppercase; color:var(--ink-subtle); margin:0 0 8px; }
  @media (prefers-reduced-motion: reduce) { .btn { transition:none } .btn:active { transform:none } }
</style>
<p class="cap">Option E — green accent</p>
<div class="row">
  <button class="btn btn-green">Join as a teacher</button>
  <button class="btn btn-outline">For schools</button>
</div>
<p class="cap">Option D — gold accent</p>
<div class="row">
  <button class="btn btn-gold">Join as a teacher</button>
  <button class="btn btn-navy">Book a demo</button>
</div>
