<!-- @dsCard height=288 -->
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Google+Sans:GRAD,wght@-50..150,400..700&display=swap">
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface); overflow:hidden; }
  .cover { position:relative; width:960px; height:288px; }
  svg { position:absolute; inset:0; display:block; }
  .slab   { fill:var(--ink); }
  .gold   { fill:var(--gold); }
  .map    { fill:var(--map-signal); }
  .green  { fill:var(--green-ink); }
  .yellow { fill:var(--yellow); }
  .contour { fill:none; stroke:var(--surface); stroke-width:1.5; opacity:.48; }
  .name { position:absolute; left:48px; bottom:64px; width:440px;
    font-family:"Google Sans", ui-sans-serif, system-ui, sans-serif;
    font-variation-settings:"wght" 700, "GRAD" 120; font-weight:700;
    font-size:76px; line-height:.92; letter-spacing:.004em; text-transform:uppercase;
    color:var(--ink); margin:0; }
  .tag { position:absolute; left:48px; bottom:32px; width:440px;
    font-family:Archivo, ui-sans-serif, system-ui, sans-serif;
    font-variation-settings:"wdth" 88; font-weight:500; font-size:13.5px; line-height:1.4;
    color:var(--ink-muted); margin:0; }
</style>
<div class="cover">
  <!-- blocks: ink 128x288, gold 96x160, map-signal 96x128, green-ink 128x288, yellow 128x96 -->
  <!-- arrangement: unequal vertical bands, bleeding off the top, right and bottom edges; ground kept open under the yellow for relief -->
  <!-- pattern: contour lines — the literal motif. The README opens by calling the design a survey sheet whose contours run under every section as one continuous terrain, so the cover draws that terrain across the colour instead of a generic grid -->
  <!-- scales: widths and heights are space-10 (128), space-9 (96) and 160 = space-10 + space-6; every corner radius-none (0) -->
  <svg viewBox="0 0 960 288" aria-hidden="true">
    <defs>
      <clipPath id="field"><rect x="480" y="0" width="480" height="288"/></clipPath>
    </defs>
    <rect class="slab"   x="480" y="0"   width="128" height="288"/>
    <rect class="gold"   x="608" y="0"   width="96"  height="160"/>
    <rect class="map"    x="608" y="160" width="96"  height="128"/>
    <rect class="green"  x="704" y="0"   width="128" height="288"/>
    <rect class="yellow" x="832" y="0"   width="128" height="96"/>
    <g clip-path="url(#field)" transform="rotate(-18 744 136)">
      <ellipse class="contour" cx="744" cy="136" rx="42"  ry="28"/>
      <ellipse class="contour" cx="744" cy="136" rx="82"  ry="55"/>
      <ellipse class="contour" cx="744" cy="136" rx="124" ry="83"/>
      <ellipse class="contour" cx="744" cy="136" rx="168" ry="112"/>
      <ellipse class="contour" cx="744" cy="136" rx="214" ry="142"/>
      <ellipse class="contour" cx="744" cy="136" rx="262" ry="173"/>
    </g>
  </svg>
  <p class="name">Class Act<br>Talent</p>
  <p class="tag">Ethical recruitment for international schools.</p>
</div>
